[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jellyfin-renamer"
version = "0.1.0"
description = "Safely rename Jellyfin movie files and folders"
requires-python = ">=3.11"

[project.scripts]
jellyfin-renamer = "jellyfin_renamer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
